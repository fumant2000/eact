# Dev uniquement (chargé automatiquement par `docker compose up`) : ports sur 127.0.0.1, modifiables dans .env.
# `data` étant internal (ADR 0006), postgres/redis/s3 rejoignent aussi `devhost` pour être joignables du poste.
services:
  postgres:
    ports: ["127.0.0.1:${PG_HOST_PORT:-5433}:5432"]
    networks: [data, devhost]
  redis:
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"]
    networks: [data, devhost]
  s3:
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_HOST_PORT:-9001}:9001"      # console RustFS
    networks: [data, devhost]
  mailpit:
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"         # boîte mail web
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"                 # SMTP pour l'API lancée sur le poste
  gotenberg:
    ports: ["127.0.0.1:${GOTENBERG_HOST_PORT:-3002}:3000"]  # PDF/A pour l'API lancée sur le poste
  api:
    ports: ["127.0.0.1:${API_HOST_PORT:-3000}:3000"]        # Swagger : /docs

networks:
  devhost: {}
