# EACT — socle Docker Compose (CT-09, ENF-15)
#
#   cp .env.example .env
#   npm run infra                             # MODE LÉGER (dev, démo) : postgres + redis + mailpit ;
#                                             #   api et web tournent sur le poste (npm run dev:api / dev:web)
#   npm run infra:pdf                         # + gotenberg (génération du PDF/A à la signature)
#   docker compose --profile dev up -d --build   # architecture complète conteneurisée (+ mailpit)
#   docker compose --profile obs up -d        # + prometheus / grafana / loki / alloy
#
# Les adresses ci-dessous sont des NOMS DE SERVICE Docker (transparence de localisation, CDC §16.5) :
# elles ne viennent pas du .env, qui décrit le poste du développeur (localhost).
#
# Zones réseau (ADR 0006) : seul `nginx` publie un port.

name: eact

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://s3:9000
  S3_ACCESS_KEY: ${S3_ROOT_USER}
  S3_SECRET_KEY: ${S3_ROOT_PASSWORD}
  S3_BUCKET_ACTES: ${S3_BUCKET_ACTES:-actes}
  S3_BUCKET_PIECES: ${S3_BUCKET_PIECES:-pieces}
  GOTENBERG_URL: http://gotenberg:3000
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  MAIL_FROM: ${MAIL_FROM:-EACT MINESUP <ne-pas-repondre@eact.test>}
  ANTIVIRUS: clamav
  STOCKAGE: s3
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
  GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app_key
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  GITHUB_TEMPLATES_REPO: ${GITHUB_TEMPLATES_REPO:-}
  GITHUB_ISSUES_REPO: ${GITHUB_ISSUES_REPO:-}

services:
  # ─────────────── Zone DMZ ───────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web: { condition: service_started }
      api: { condition: service_healthy }
    networks: [dmz, app]
    restart: unless-stopped

  # ─────────────── Zone applicative ───────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_INTERNAL_URL: http://api:3000
      NEXT_PUBLIC_API_URL: /api
    networks: [app]
    restart: unless-stopped

  # Applique les migrations Prisma puis s'arrête ; l'API ne démarre qu'après.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: eact/api:local
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: eact/api:local
    command: ["node", "dist/main.js"]
    environment: *app-env
    secrets: [github_app_key]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [app, data]
    restart: unless-stopped

  # Même image que l'API, autre point d'entrée : files BullMQ (PDF/A, antivirus,
  # GitHub, notifications, relances). Seul service autorisé à sortir sur Internet.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: eact/api:local
    command: ["node", "dist/worker.js"]
    environment: *app-env
    secrets: [github_app_key]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      gotenberg: { condition: service_started }
      clamav: { condition: service_healthy }
    networks: [app, data, egress]
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-timeout=60s", "--log-level=warn"]
    networks: [app]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    volumes:
      - clamav-db:/var/lib/clamav
    networks: [app, egress]   # egress : mise à jour des signatures (freshclam)
    restart: unless-stopped

  # ─────────────── Zone données ───────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Africa/Douala   # fuseau IANA de tout le Cameroun (Yaoundé compris)
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  # Stockage objet compatible S3 (ADR 0005). RustFS (Apache-2.0) remplace MinIO, dont les images
  # officielles ne sont plus publiées. Le métier ne voit que IStockage : changer de serveur S3 = changer ce bloc.
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:9000/"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  # Crée les buckets au premier démarrage puis s'arrête. Client S3 générique : indépendant du serveur.
  s3-init:
    image: amazon/aws-cli:2.39.3
    depends_on:
      s3: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      set -e;
      for b in $${S3_BUCKET_ACTES} $${S3_BUCKET_PIECES} gabarits-cache; do
      aws --endpoint-url http://s3:9000 s3api head-bucket --bucket $$b 2>/dev/null || aws --endpoint-url http://s3:9000 s3 mb s3://$$b;
      done;
      aws --endpoint-url http://s3:9000 s3api put-bucket-versioning --bucket $${S3_BUCKET_ACTES} --versioning-configuration Status=Enabled;
      echo buckets prets
      "
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET_ACTES: ${S3_BUCKET_ACTES:-actes}
      S3_BUCKET_PIECES: ${S3_BUCKET_PIECES:-pieces}
    networks: [data]
    restart: "no"

  # ─────────────── Outils de dev (profil dev) ───────────────
  # Faux serveur SMTP : capte TOUS les e-mails (réinitialisation, notifications) ; boîte web sur :8025.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [dev]
    networks: [app]

  # ─────────────── Supervision (profil obs) — ENF-03 ───────────────
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [obs]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [app, obs]

  loki:
    image: grafana/loki:3.5.0
    profiles: [obs]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    networks: [obs]

  alloy:
    image: grafana/alloy:v1.10.0
    profiles: [obs]
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [obs]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [obs, app]

networks:
  dmz: {}
  app: {}
  data:
    internal: true      # aucune sortie Internet, aucun port publié
  egress: {}
  obs: {}

volumes:
  pg-data: {}
  redis-data: {}
  s3-data: {}
  clamav-db: {}
  prometheus-data: {}
  loki-data: {}
  grafana-data: {}

secrets:
  github_app_key:
    file: ${GITHUB_APP_KEY_FILE:-./infra/secrets/github-app.pem}
