# Point d'entrée unique (CT-12). En prod : ajouter le bloc 443 + certificats.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 25m;              # BF-18 : 20 Mo par pièce + marge

  # DNS Docker + `resolve` : les instances api ajoutées ou retirées sont prises en compte (TF-15)
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api { zone api 64k; server api:3000 resolve; }
  upstream web { zone web 64k; server web:3000 resolve; }

  limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Anti force brute : seules les routes qui testent un secret (pas /auth/moi ni le refresh, appelés à chaque page)
    location ~ ^/api/v1/auth/(login|mfa/verify|mfa/enrolement|mot-de-passe/|demo/connexion) {
      limit_req zone=auth burst=10 nodelay;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
      proxy_pass http://api/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503;   # retire une instance défaillante
    }
    location /ws/ {
      proxy_pass http://api/ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location /api/public/ {
      limit_req zone=public burst=20;
      proxy_pass http://api/public/;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
