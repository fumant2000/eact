# EACT — socle Docker Compose (CT-09, ENF-15)
#
#   cp .env.example .env
#   docker compose up -d --build              # socle applicatif
#   docker compose --profile dev up -d        # + mailpit (faux SMTP)
#   docker compose --profile obs up -d        # + prometheus / grafana / loki / alloy
#
# Zones réseau (ADR 0006) : seul `nginx` publie un port.

name: eact

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET_ACTES: ${S3_BUCKET_ACTES:-actes}
  S3_BUCKET_PIECES: ${S3_BUCKET_PIECES:-pieces}
  GOTENBERG_URL: http://gotenberg:3000
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
  GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app_key
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  GITHUB_TEMPLATES_REPO: ${GITHUB_TEMPLATES_REPO:-}
  GITHUB_ISSUES_REPO: ${GITHUB_ISSUES_REPO:-}

services:
  # ─────────────── Zone DMZ ───────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web: { condition: service_started }
      api: { condition: service_healthy }
    networks: [dmz, app]
    restart: unless-stopped

  # ─────────────── Zone applicative ───────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_INTERNAL_URL: http://api:3000
      NEXT_PUBLIC_API_URL: /api
    networks: [app]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/main.js"]
    environment: *app-env
    secrets: [github_app_key]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [app, data]
    restart: unless-stopped

  # Même image que l'API, autre point d'entrée : files BullMQ (PDF/A, antivirus,
  # GitHub, notifications, relances). Seul service autorisé à sortir sur Internet.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    environment: *app-env
    secrets: [github_app_key]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      gotenberg: { condition: service_started }
      clamav: { condition: service_healthy }
    networks: [app, data, egress]
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-timeout=60s", "--log-level=warn"]
    networks: [app]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    volumes:
      - clamav-db:/var/lib/clamav
    networks: [app, egress]   # egress : mise à jour des signatures (freshclam)
    restart: unless-stopped

  # ─────────────── Zone données ───────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Africa/Douala   # fuseau IANA de tout le Cameroun (Yaoundé compris)
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  minio:
    # Tag à figer avant la prod (voir ADR 0005).
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  # Crée les buckets au premier démarrage puis s'arrête.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set eact http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing eact/$${S3_BUCKET_ACTES} &&
      mc mb --ignore-existing eact/$${S3_BUCKET_PIECES} &&
      mc mb --ignore-existing eact/gabarits-cache &&
      mc version enable eact/$${S3_BUCKET_ACTES}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_ACTES: ${S3_BUCKET_ACTES:-actes}
      S3_BUCKET_PIECES: ${S3_BUCKET_PIECES:-pieces}
    networks: [data]
    restart: "no"

  # ─────────────── Outils de dev (profil dev) ───────────────
  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev]
    networks: [app]

  # ─────────────── Supervision (profil obs) — ENF-03 ───────────────
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [obs]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [app, obs]

  loki:
    image: grafana/loki:3.5.0
    profiles: [obs]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    networks: [obs]

  alloy:
    image: grafana/alloy:v1.10.0
    profiles: [obs]
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [obs]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [obs, app]

networks:
  dmz: {}
  app: {}
  data:
    internal: true      # aucune sortie Internet, aucun port publié
  egress: {}
  obs: {}

volumes:
  pg-data: {}
  redis-data: {}
  minio-data: {}
  clamav-db: {}
  prometheus-data: {}
  loki-data: {}
  grafana-data: {}

secrets:
  github_app_key:
    file: ${GITHUB_APP_KEY_FILE:-./infra/secrets/github-app.pem}
