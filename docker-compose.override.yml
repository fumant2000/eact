# Chargé automatiquement en dev par `docker compose up`.
# Publie les ports des outils pour le poste du développeur (jamais en prod).
services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
  minio:
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]   # 9001 = console
  mailpit:
    ports: ["127.0.0.1:8025:8025"]                           # boîte mail web
  api:
    ports: ["127.0.0.1:3000:3000"]                           # Swagger : /docs
