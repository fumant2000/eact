# CDC §22 : aucune fusion si la CI échoue.
name: CI
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  qualite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: eact, POSTGRES_PASSWORD: eact, POSTGRES_DB: eact_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eact:eact@localhost:5432/eact_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx -w @eact/api prisma migrate deploy
      - run: npm test
      - run: npm run build

  images:
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t eact-api .
      - run: docker build -f apps/web/Dockerfile -t eact-web .
